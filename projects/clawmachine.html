<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kawaii Claw Machine 🎀</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Comic+Neue:wght@700&family=Mochiy+Pop+P+One&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #f8c8dc 0%, #f5b4d0 100%);
      min-height: 100vh;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    .kawaii-font {
      font-family: 'Mochiy Pop P One', sans-serif;
      letter-spacing: 1px;
    }

    /* Animations */
    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(-3deg);
      }

      50% {
        transform: rotate(3deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    @keyframes slideIn {
      0% {
        transform: translateY(-30px);
        opacity: 0;
      }

      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .bounce-animation {
      animation: bounce 2s ease-in-out infinite;
    }

    .wiggle-animation {
      animation: wiggle 1s ease-in-out infinite;
    }

    .pulse-animation {
      animation: pulse 2s ease-in-out infinite;
    }

    .slide-in {
      animation: slideIn 0.5s ease-out;
    }

    /* Game canvas styling */
    #gameCanvas {
      border-radius: 15px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.2),
        0 0 0 8px #ff6bb5,
        0 0 0 12px #ff4da6,
        inset 0 0 20px rgba(255, 255, 255, 0.8);
      background: linear-gradient(180deg, #fff0f7 0%, #ffebf3 100%);
      border: 5px solid #ff4da6;
      max-width: 100%;
      height: auto;
    }

    /* Kawaii button styles */
    .kawaii-btn {
      background: linear-gradient(145deg, #ff6bb5, #ff4da6);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      box-shadow:
        0 4px 0 #ff3385,
        0 8px 15px rgba(255, 107, 181, 0.3);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      font-family: 'Mochiy Pop P One', sans-serif;
      letter-spacing: 0.5px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }

    .kawaii-btn:hover {
      transform: translateY(-3px);
      box-shadow:
        0 7px 0 #ff3385,
        0 12px 20px rgba(255, 107, 181, 0.4);
    }

    .kawaii-btn:active {
      transform: translateY(2px);
      box-shadow:
        0 2px 0 #ff3385,
        0 5px 10px rgba(255, 107, 181, 0.3);
    }

    .control-btn {
      background: linear-gradient(145deg, #ffb3c6, #ff9ec0);
      border: 3px solid #ff6bb5;
      border-radius: 50%;
      color: #ff4da6;
      box-shadow:
        0 4px 0 #ff6bb5,
        0 6px 10px rgba(255, 107, 181, 0.2);
      transition: all 0.2s ease;
      width: 55px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }

    @media (min-width: 768px) {
      .control-btn {
        width: 50px;
        height: 50px;
        font-size: 1.2rem;
      }
    }

    .control-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 6px 0 #ff6bb5,
        0 8px 15px rgba(255, 107, 181, 0.3);
    }

    .control-btn:active, .control-btn.active {
      transform: translateY(1px);
      box-shadow:
        0 3px 0 #ff6bb5,
        0 4px 8px rgba(255, 107, 181, 0.2);
      background: linear-gradient(145deg, #ff9ec0, #ffb3c6);
    }

    /* Prize card styles */
    .prize-card {
      background: white;
      border-radius: 10px;
      border: 2px solid #ffb3c6;
      box-shadow: 0 4px 8px rgba(255, 107, 181, 0.1);
      transition: all 0.3s ease;
      overflow: hidden;
      padding: 8px;
    }

    .prize-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(255, 107, 181, 0.3);
      border-color: #ff6bb5;
      z-index: 10;
    }

    .prize-card.collected {
      background: linear-gradient(145deg, #fff0f7, #ffebf3);
      border-color: #ff4da6;
      box-shadow: 0 4px 8px rgba(255, 77, 166, 0.3);
    }

    /* Kawaii modal */
    .kawaii-modal {
      background: linear-gradient(145deg, #fff0f7, #ffe6f2);
      border-radius: 15px;
      border: 4px solid #ffb3c6;
      box-shadow:
        0 10px 25px rgba(255, 107, 181, 0.3),
        inset 0 0 0 4px white;
      z-index: 1000;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Modal overlay */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Progress bar */
    .kawaii-progress {
      height: 10px;
      border-radius: 8px;
      background: #ffe6f2;
      border: 2px solid #ffb3c6;
      overflow: hidden;
    }

    .kawaii-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff9ec0, #ff6bb5, #ff4da6);
      border-radius: 6px;
      box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.5);
    }

    /* Sticker effect */
    .sticker {
      background: white;
      border-radius: 12px;
      border: 2px dashed #ff9ec0;
      padding: 12px;
      box-shadow: 0 4px 10px rgba(255, 107, 181, 0.1);
    }

    /* Heart particles */
    .heart-particle {
      position: absolute;
      color: #ff6bb5;
      pointer-events: none;
      z-index: 100;
    }

    /* Game instructions */
    .instructions {
      background: linear-gradient(145deg, #fff0f7, #ffe6f2);
      border-radius: 12px;
      border: 2px solid #ffb3c6;
      padding: 12px;
    }

    /* Claw Machine Container */
    .machine-container {
      background: linear-gradient(145deg, #ff3385, #ff6bb5);
      border-radius: 20px;
      padding: 20px;
      box-shadow:
        0 15px 30px rgba(0, 0, 0, 0.2),
        inset 0 -5px 15px rgba(0, 0, 0, 0.1);
      border: 5px solid #ff4da6;
      position: relative;
    }

    /* Prize slot */
    .prize-slot {
      background: linear-gradient(145deg, #ff9ec0, #ff6bb5);
      border-radius: 8px;
      padding: 8px;
      margin: 5px;
      min-height: 60px;
      min-width: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #ff4da6;
    }

    /* Mobile optimizations */
    @media (max-width: 768px) {
      .mobile-order-1 {
        order: 1;
      }
      
      .mobile-order-2 {
        order: 2;
      }
      
      .mobile-order-3 {
        order: 3;
      }
      
      .machine-container {
        padding: 15px;
      }
      
      #gameCanvas {
        max-height: 350px;
        object-fit: contain;
      }
      
      .control-btn {
        width: 55px;
        height: 55px;
        font-size: 1.3rem;
      }
      
      .drop-btn {
        width: 60px;
        height: 60px;
      }
    }

    /* Reset button */
    .reset-btn {
      background: linear-gradient(145deg, #ffb3c6, #ff9ec0);
      border: 3px solid #ff6bb5;
      border-radius: 12px;
      color: #ff4da6;
      box-shadow:
        0 4px 0 #ff6bb5,
        0 6px 10px rgba(255, 107, 181, 0.2);
      transition: all 0.2s ease;
      padding: 10px 20px;
      font-weight: bold;
      font-family: 'Mochiy Pop P One', sans-serif;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-top: 15px;
      font-size: 14px;
    }

    @media (min-width: 768px) {
      .reset-btn {
        font-size: 16px;
        padding: 12px 24px;
      }
    }

    .reset-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 6px 0 #ff6bb5,
        0 8px 15px rgba(255, 107, 181, 0.3);
    }

    .reset-btn:active {
      transform: translateY(1px);
      box-shadow:
        0 3px 0 #ff6bb5,
        0 4px 8px rgba(255, 107, 181, 0.2);
    }

    /* Hide scrollbar for game messages */
    .no-scroll {
      overflow: hidden;
    }
  </style>
</head>

<body>
  <!-- Main Container -->
  <div class="min-h-screen py-6 px-4">
    <div class="max-w-4xl mx-auto">
      <!-- Header -->
      <div class="text-center mb-6 slide-in">
        <div class="flex justify-center items-center mb-3">
          <h1 class="text-4xl md:text-5xl font-bold kawaii-font ml-3">
            <span class="bg-gradient-to-r from-pink-500 via-purple-500 to-pink-500 bg-clip-text text-transparent">
              Kawaii Claw Machine
            </span>
          </h1>
        </div>
        <p class="text-lg text-pink-600 mb-2">Win ADORABLE plushies! Collect them all!</p>
      </div>

      <!-- Game Container - Mobile Reorder -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Center Panel - Claw Machine (First on Mobile) -->
        <div class="lg:col-span-2 mobile-order-1">
          <!-- Main Machine Container -->
          <div class="machine-container slide-in" style="animation-delay: 0.3s;">

            <!-- Game Canvas Container -->
            <div class="text-center relative">
              <canvas id="gameCanvas" width="700" height="450" class="w-full"></canvas>

              <!-- Win Message -->
              <div id="winMessage" class="hidden">
                <div class="modal-overlay">
                  <div class="kawaii-modal p-6 text-center max-w-xs w-11/12">
                    <div class="text-5xl mb-3 bounce-animation">🎉</div>
                    <h3 class="text-2xl font-bold kawaii-font text-pink-600 mb-2">YOU WON!</h3>
                    <div class="mb-3">
                      <!-- REMOVED BORDER/BACKGROUND FROM PRIZE IMAGE -->
                      <img id="wonPrizeImage" src="" alt="Won Prize" class="w-24 h-24 object-contain mx-auto">
                    </div>
                    <p class="text-lg text-gray-700" id="prizeName">Cute Plushie</p>
                    <p class="text-base text-purple-500 mt-1">+<span id="prizePoints">50</span> points!</p>
                    <button id="continueBtn" class="kawaii-btn px-6 py-2 mt-4 text-base">
                      Keep Playing!
                    </button>
                  </div>
                </div>
              </div>

              <!-- Lose Message -->
              <div id="loseMessage" class="hidden">
                <div class="modal-overlay">
                  <div class="kawaii-modal p-6 text-center max-w-xs w-11/12">
                    <div class="text-5xl mb-3 wiggle-animation">😢</div>
                    <h3 class="text-2xl font-bold kawaii-font text-purple-600 mb-2">OH NO!</h3>
                    <p class="text-lg text-gray-700">The prize slipped away!</p>
                    <button id="tryAgainBtn" class="kawaii-btn px-6 py-2 mt-4 text-base">
                      Try Again!
                    </button>
                  </div>
                </div>
              </div>

              <!-- No Tokens Message -->
              <div id="noTokensMessage" class="hidden">
                <div class="modal-overlay">
                  <div class="kawaii-modal p-6 text-center max-w-xs w-11/12">
                    <div class="text-5xl mb-3 pulse-animation">🪙</div>
                    <h3 class="text-2xl font-bold kawaii-font text-purple-600 mb-2">OUT OF TOKENS!</h3>
                    <p class="text-lg text-gray-700 mb-3">Get more to keep playing!</p>
                    <button id="getMoreTokensBtn" class="kawaii-btn px-6 py-2 text-base">
                      Get 20 Tokens ✨
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Control Layout -->
            <div class="flex flex-col items-center mt-4">
              <!-- Arrow Controls -->
              <div class="mb-3">
                <div class="grid grid-cols-3 gap-3 items-center justify-center">

                  <button id="leftBtn" class="control-btn">
                    <i class="fas fa-arrow-left"></i>
                  </button>

                  <button id="dropBtn"
                    class="control-btn drop-btn">
                    <div class="text-2xl">🕹️</div>
                  </button>

                  <button id="rightBtn" class="control-btn">
                    <i class="fas fa-arrow-right"></i>
                  </button>
                </div>
              </div>
              
              <!-- Reset Button -->
              <button id="resetBtn" class="reset-btn">
                <i class="fas fa-redo mr-2"></i> Reset Game
              </button>
            </div>
          </div>
        </div>

        <!-- Left Panel - Stats & Collection (Second on Mobile) -->
        <div class="space-y-6 mobile-order-2">
          <!-- Player Stats -->
          <div class="sticker slide-in" style="animation-delay: 0.1s;">
            <div class="flex items-center mb-3">
              <div
                class="w-8 h-8 rounded-full bg-gradient-to-r from-pink-400 to-purple-400 flex items-center justify-center mr-2">
                <i class="fas fa-user text-white text-sm"></i>
              </div>
              <h3 class="text-xl font-bold kawaii-font text-pink-600">Your Stats</h3>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
              <div class="text-center prize-card">
                <div class="text-2xl font-bold text-pink-500" id="tokenCount">200</div>
                <div class="text-xs text-gray-600">Tokens</div>
              </div>
              <div class="text-center prize-card">
                <div class="text-2xl font-bold text-purple-500" id="score">0</div>
                <div class="text-xs text-gray-600">Score</div>
              </div>
            </div>

            <div class="space-y-3">
              <div>
                <div class="flex justify-between text-xs mb-1">
                  <span class="font-semibold text-gray-700">Wins Today</span>
                  <span class="font-bold text-pink-600" id="winsCount">0</span>
                </div>
                <div class="kawaii-progress">
                  <div id="winsBar" class="kawaii-progress-bar" style="width: 0%"></div>
                </div>
              </div>

              <div>
                <div class="flex justify-between text-xs mb-1">
                  <span class="font-semibold text-gray-700">Collection</span>
                  <span class="font-bold text-purple-600" id="collectionProgress">0/16</span>
                </div>
                <div class="kawaii-progress">
                  <div id="collectionBar" class="kawaii-progress-bar" style="width: 0%"></div>
                </div>
              </div>
            </div>

            <button id="addTokensBtn" class="w-full kawaii-btn py-2 mt-4 text-sm">
              <i class="fas fa-plus mr-1"></i> Get More Tokens
            </button>
          </div>

          <!-- Your Collection -->
          <div class="sticker slide-in" style="animation-delay: 0.2s;">
            <div class="flex items-center mb-3">
              <div
                class="w-8 h-8 rounded-full bg-gradient-to-r from-purple-400 to-pink-400 flex items-center justify-center mr-2">
                <i class="fas fa-trophy text-white text-sm"></i>
              </div>
              <h3 class="text-xl font-bold kawaii-font text-purple-600">Your Collection</h3>
            </div>

            <div id="prizeCollection" class="grid grid-cols-4 gap-2">
              <!-- Collection will be populated by JavaScript -->
            </div>

            <p class="text-center text-xs text-gray-600 mt-3">
              Collect all 16 prizes!
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Game JavaScript -->
  <script>
    // Game Variables
    let tokens = 200;
    let score = 0;
    let wins = 0;
    let collectedPrizes = 0;
    let totalPrizes = 16;
    let gameActive = true;
    let clawX = 350;
    let clawY = 50;
    let clawSpeed = 5;
    let clawDropping = false;
    let clawRaising = false;
    let clawHasPrize = false;
    let clawOpen = true;
    let clawGrabbing = false;
    let currentPrize = null;
    let clawWidth = 60;
    let clawHeight = 40;
    let clawAnimation = false;
    let clawGrabStrength = 1.0;
    let prizeLiftedY = 0;
    let prizeBeingLifted = null;
    let clawDropSpeed = 8;
    let clawRiseSpeed = 6;


    // ALL 16 PRIZES with original positions - 
    const originalPrizes = [
      { id: 1, name: "Cat in Tiger Hat", image: "/clawmachine/cat1.png", points: 55, color: "#FFB3C6", x: 80, y: 375, width: 70, height: 70, collected: false, weight: 0.3, lifted: false, beingCarried: false },
      { id: 2, name: "Ginger", image: "/clawmachine/cat2.png", points: 60, color: "#FF9EBD", x: 150, y: 372, width: 68, height: 68, collected: false, weight: 0.4, lifted: false, beingCarried: false },
      { id: 3, name: "Cat in a Coffee Cup", image: "/clawmachine/cat3.png", points: 65, color: "#FF6B9D", x: 220, y: 378, width: 72, height: 72, collected: false, weight: 0.2, lifted: false, beingCarried: false },
      { id: 4, name: "Cat with Cookie", image: "/clawmachine/cat4.png", points: 70, color: "#C77DFF", x: 290, y: 371, width: 69, height: 69, collected: false, weight: 0.3, lifted: false, beingCarried: false },
      { id: 5, name: "Chill Cat", image: "/clawmachine/cat5.png", points: 50, color: "#FFD166", x: 360, y: 345, width: 74, height: 74, collected: false, weight: 0.4, lifted: false, beingCarried: false },
      { id: 6, name: "Happy Cat", image: "/clawmachine/cat6.png", points: 75, color: "#FF9EBD", x: 430, y: 374, width: 71, height: 71, collected: false, weight: 0.3, lifted: false, beingCarried: false },
      { id: 7, name: "Girly Cat", image: "/clawmachine/cat7.png", points: 65, color: "#FF6B9D", x: 500, y: 380, width: 73, height: 73, collected: false, weight: 0.4, lifted: false, beingCarried: false },
      { id: 8, name: "Sad Cat", image: "/clawmachine/cat8.png", points: 55, color: "#B8F2E6", x: 570, y: 370, width: 68, height: 68, collected: false, weight: 0.3, lifted: false, beingCarried: false },
      { id: 9, name: "Crying Cat", image: "/clawmachine/cat9.png", points: 80, color: "#C77DFF", x: 100, y: 378, width: 75, height: 75, collected: false, weight: 0.2, lifted: false, beingCarried: false },
      { id: 10, name: "Ponder Cat", image: "/clawmachine/cat10.png", points: 85, color: "#FF6B6B", x: 170, y: 372, width: 74, height: 74, collected: false, weight: 0.3, lifted: false, beingCarried: false },
      { id: 11, name: "Cat with Yarn", image: "/clawmachine/cat11.png", points: 45, color: "#A3BFFA", x: 240, y: 376, width: 70, height: 70, collected: false, weight: 0.4, lifted: false, beingCarried: false },
      { id: 12, name: "Cat in a Box", image: "/clawmachine/cat12.png", points: 70, color: "#B8F2E6", x: 310, y: 373, width: 72, height: 72, collected: false, weight: 0.2, lifted: false, beingCarried: false },
      { id: 13, name: "Cat with a Phone", image: "/clawmachine/cat13.png", points: 60, color: "#FFB3C6", x: 380, y: 379, width: 69, height: 69, collected: false, weight: 0.3, lifted: false, beingCarried: false },
      { id: 14, name: "Melted Cat", image: "/clawmachine/cat14.png", points: 65, color: "#FF9EBD", x: 450, y: 371, width: 71, height: 71, collected: false, weight: 0.4, lifted: false, beingCarried: false },
      { id: 15, name: "Laying Cat", image: "/clawmachine/cat15.png", points: 90, color: "#FF6B9D", x: 520, y: 375, width: 75, height: 75, collected: false, weight: 0.3, lifted: false, beingCarried: false },
      { id: 16, name: "Cat eating Watermelon", image: "/clawmachine/cat16.png", points: 95, color: "#C77DFF", x: 590, y: 377, width: 74, height: 74, collected: false, weight: 0.2, lifted: false, beingCarried: false }
    ];

    // Current prizes array (will be reset to original)
    let prizes = JSON.parse(JSON.stringify(originalPrizes));

    // Cache images
    const prizeImages = {};
    const prizeImageLoaded = {};

    // DOM Elements
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const tokenCountEl = document.getElementById('tokenCount');
    const scoreEl = document.getElementById('score');
    const winsCountEl = document.getElementById('winsCount');
    const winsBarEl = document.getElementById('winsBar');
    const collectionProgressEl = document.getElementById('collectionProgress');
    const collectionBarEl = document.getElementById('collectionBar');
    const prizeCollectionEl = document.getElementById('prizeCollection');
    const winMessageEl = document.getElementById('winMessage');
    const loseMessageEl = document.getElementById('loseMessage');
    const noTokensMessageEl = document.getElementById('noTokensMessage');
    const prizeNameEl = document.getElementById('prizeName');
    const prizePointsEl = document.getElementById('prizePoints');
    const wonPrizeImageEl = document.getElementById('wonPrizeImage');

    // Button Elements
    const leftBtn = document.getElementById('leftBtn');
    const rightBtn = document.getElementById('rightBtn');
    const dropBtn = document.getElementById('dropBtn');
    const resetBtn = document.getElementById('resetBtn');
    const continueBtn = document.getElementById('continueBtn');
    const tryAgainBtn = document.getElementById('tryAgainBtn');
    const addTokensBtn = document.getElementById('addTokensBtn');
    const getMoreTokensBtn = document.getElementById('getMoreTokensBtn');

    // Create heart particles
    function createHeartParticles(x, y, count = 10) {
      for (let i = 0; i < count; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart-particle';
        heart.innerHTML = '💖';
        heart.style.left = `${x}px`;
        heart.style.top = `${y}px`;
        heart.style.fontSize = `${Math.random() * 15 + 10}px`;
        heart.style.opacity = '0.8';

        document.body.appendChild(heart);

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 2;
        const vx = Math.cos(angle) * speed;
        let vy = Math.sin(angle) * speed - 2;

        let posX = x;
        let posY = y;
        let opacity = 0.8;

        const animateHeart = () => {
          posX += vx;
          posY += vy;
          vy += 0.1;
          opacity -= 0.02;

          heart.style.left = `${posX}px`;
          heart.style.top = `${posY}px`;
          heart.style.opacity = opacity;

          if (opacity > 0) {
            requestAnimationFrame(animateHeart);
          } else {
            document.body.removeChild(heart);
          }
        };

        requestAnimationFrame(animateHeart);
      }
    }

    // Show modal and disable background
    function showModal(modalElement) {
      modalElement.classList.remove('hidden');
      document.body.classList.add('no-scroll');
    }

    // Hide modal and enable background
    function hideModal(modalElement) {
      modalElement.classList.add('hidden');
      document.body.classList.remove('no-scroll');
    }

    // Initialize game
    async function initGame() {
      await loadPrizeImages();
      setupEventListeners();
      updateUI();
      drawGame();
      gameLoop();
    }

    // Load prize images
    async function loadPrizeImages() {
      const loadPromises = prizes.map(prize => {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            prizeImages[prize.id] = img;
            prizeImageLoaded[prize.id] = true;
            resolve();
          };
          img.onerror = () => {
            // Create fallback
            const fallbackCanvas = document.createElement('canvas');
            fallbackCanvas.width = 100;
            fallbackCanvas.height = 100;
            const fallbackCtx = fallbackCanvas.getContext('2d');

            fallbackCtx.fillStyle = prize.color;
            fallbackCtx.fillRect(0, 0, 100, 100);

            // Simple face
            fallbackCtx.fillStyle = 'white';
            fallbackCtx.beginPath();
            fallbackCtx.arc(30, 30, 15, 0, Math.PI * 2);
            fallbackCtx.arc(70, 30, 15, 0, Math.PI * 2);
            fallbackCtx.fill();

            fallbackCtx.fillStyle = 'black';
            fallbackCtx.beginPath();
            fallbackCtx.arc(30, 30, 7, 0, Math.PI * 2);
            fallbackCtx.arc(70, 30, 7, 0, Math.PI * 2);
            fallbackCtx.fill();

            prizeImages[prize.id] = fallbackCanvas;
            prizeImageLoaded[prize.id] = false;
            resolve();
          };
          img.src = prize.image;
        });
      });

      await Promise.all(loadPromises);
    }

    // Update UI elements
    function updateUI() {
      tokenCountEl.textContent = tokens;
      scoreEl.textContent = score;
      winsCountEl.textContent = wins;
      collectionProgressEl.textContent = `${collectedPrizes}/${totalPrizes}`;

      // Update progress bars
      winsBarEl.style.width = `${Math.min(wins * 10, 100)}%`;
      collectionBarEl.style.width = `${(collectedPrizes / totalPrizes) * 100}%`;

      // Update prize collection display
      updatePrizeCollection();
    }

    // Update prize collection display
    function updatePrizeCollection() {
      prizeCollectionEl.innerHTML = '';

      const collectedPrizesList = prizes.filter(prize => prize.collected);

      if (collectedPrizesList.length === 0) {
        const emptyMessage = document.createElement('div');
        emptyMessage.className = 'col-span-4 text-center py-4';
        emptyMessage.innerHTML = `
          <div class="text-3xl mb-2 text-gray-300">📦</div>
          <p class="text-sm text-gray-500">No prizes collected yet!</p>
          <p class="text-xs text-gray-400">Play to win prizes!</p>
        `;
        prizeCollectionEl.appendChild(emptyMessage);
      } else {
        collectedPrizesList.forEach(prize => {
          const prizeElement = document.createElement('div');
          prizeElement.className = 'prize-slot';

          if (prizeImages[prize.id] && prizeImageLoaded[prize.id]) {
            const img = document.createElement('img');
            img.src = prize.image;
            img.alt = prize.name;
            // REMOVED BACKGROUND/BORDER FROM COLLECTION IMAGES
            img.className = 'w-10 h-10 object-contain';
            prizeElement.appendChild(img);
          } else {
            const colorBox = document.createElement('div');
            colorBox.className = 'w-10 h-10 rounded';
            colorBox.style.backgroundColor = prize.color;
            prizeElement.appendChild(colorBox);
          }

          prizeCollectionEl.appendChild(prizeElement);
        });
      }
    }

    // Draw game elements
    function drawGame() {
      // Clear canvas with gradient background
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, '#fff0f7');
      gradient.addColorStop(1, '#ffebf3');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw machine frame
      ctx.fillStyle = '#FF6BB5';
      ctx.fillRect(0, 0, canvas.width, 15);
      ctx.fillRect(0, canvas.height - 15, canvas.width, 15);
      ctx.fillRect(0, 0, 15, canvas.height);
      ctx.fillRect(canvas.width - 15, 0, 15, canvas.height);

      // Draw prize area floor
      ctx.fillStyle = '#FFF0F7';
      ctx.fillRect(30, 400, canvas.width - 60, 35);

      // Draw ONLY uncollected prizes - NO BORDERS/BACKGROUNDS
      prizes.forEach(prize => {
        if (!prize.collected && prizeImages[prize.id]) {
          // If prize is being carried by claw, adjust its position
          let drawX = prize.x;
          let drawY = prize.y;

          if (prize.beingCarried) {
            drawX = clawX - prize.width / 2;
            drawY = clawY + 30 - prizeLiftedY;
          }

          // Draw prize image only (no background/border)
          if (prizeImageLoaded[prize.id]) {
            ctx.drawImage(prizeImages[prize.id], drawX, drawY, prize.width, prize.height);
          } else {
            // Fallback
            const pattern = ctx.createPattern(prizeImages[prize.id], 'no-repeat');
            ctx.fillStyle = pattern || prize.color;
            ctx.fillRect(drawX, drawY, prize.width, prize.height);
          }
        }
      });

      // Draw claw
      drawClaw();
    }

    // Draw the claw - FIXED WITH 2-PRONG MECHANICAL CLAW
    function drawClaw() {
      // Claw cable/rope - thicker and more realistic
      ctx.strokeStyle = '#333333';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(clawX, 20);
      ctx.lineTo(clawX, clawY - 25);
      ctx.stroke();

      // Cable highlight
      ctx.strokeStyle = '#666666';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(clawX - 1, 20);
      ctx.lineTo(clawX - 1, clawY - 25);
      ctx.stroke();

      // Claw top connector - mechanical looking
      ctx.fillStyle = '#555555';
      ctx.beginPath();
      ctx.rect(clawX - 15, clawY - 25, 30, 10);
      ctx.fill();

      // Connector details
      ctx.fillStyle = '#FF4DA6';
      ctx.beginPath();
      ctx.rect(clawX - 10, clawY - 23, 20, 6);
      ctx.fill();

      // Main claw body - rectangular mechanical look
      const clawBodyHeight = 25;
      ctx.fillStyle = '#333333';
      ctx.beginPath();
      ctx.roundRect(clawX - 20, clawY, 40, clawBodyHeight, 5);
      ctx.fill();

      // Body details
      ctx.fillStyle = '#FF3385';
      ctx.beginPath();
      ctx.roundRect(clawX - 18, clawY + 2, 36, clawBodyHeight - 4, 3);
      ctx.fill();

      // Claw prongs (2 mechanical fingers)
      drawClawProngs();

      // Draw grabbed prize indicator
      if (clawHasPrize && currentPrize) {
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(clawX, clawY - 10, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#FF6B00';
        ctx.beginPath();
        ctx.arc(clawX, clawY - 10, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Draw mechanical claw prongs
    function drawClawProngs() {
      const prongWidth = 12;
      const prongHeight = 30;
      const prongOffset = 25;
      const grabOffset = clawOpen ? 0 : 15;

      // Left prong
      ctx.save();
      ctx.translate(clawX - prongOffset + grabOffset, clawY + 25);

      // Prong base
      ctx.fillStyle = '#555555';
      ctx.beginPath();
      ctx.roundRect(-prongWidth / 2, 0, prongWidth, prongHeight, 3);
      ctx.fill();

      // Prong highlight
      ctx.fillStyle = '#777777';
      ctx.beginPath();
      ctx.roundRect(-prongWidth / 2 + 1, 1, prongWidth - 2, 5, 2);
      ctx.fill();

      // Prong tip
      ctx.fillStyle = '#FF3385';
      ctx.beginPath();
      ctx.moveTo(-prongWidth / 2, prongHeight - 10);
      ctx.lineTo(0, prongHeight);
      ctx.lineTo(prongWidth / 2, prongHeight - 10);
      ctx.closePath();
      ctx.fill();

      ctx.restore();

      // Right prong
      ctx.save();
      ctx.translate(clawX + prongOffset - grabOffset, clawY + 25);

      // Prong base
      ctx.fillStyle = '#555555';
      ctx.beginPath();
      ctx.roundRect(-prongWidth / 2, 0, prongWidth, prongHeight, 3);
      ctx.fill();

      // Prong highlight
      ctx.fillStyle = '#777777';
      ctx.beginPath();
      ctx.roundRect(-prongWidth / 2 + 1, 1, prongWidth - 2, 5, 2);
      ctx.fill();

      // Prong tip
      ctx.fillStyle = '#FF3385';
      ctx.beginPath();
      ctx.moveTo(-prongWidth / 2, prongHeight - 10);
      ctx.lineTo(0, prongHeight);
      ctx.lineTo(prongWidth / 2, prongHeight - 10);
      ctx.closePath();
      ctx.fill();

      ctx.restore();

      // Prong connector
      ctx.fillStyle = '#333333';
      ctx.beginPath();
      ctx.rect(clawX - 25, clawY + 20, 50, 5);
      ctx.fill();
    }

    // Add roundRect support for older browsers
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
      }
    }

    // Game loop
    function gameLoop() {
      if (!gameActive) return;

      // Move claw horizontally
      if (leftBtn.classList.contains('active') && clawX > 80) {
        clawX -= clawSpeed;
        // Move carried prize with claw
        if (prizeBeingLifted) {
          prizeBeingLifted.x = clawX - prizeBeingLifted.width / 2;
        }
      }
      if (rightBtn.classList.contains('active') && clawX < canvas.width - 80) {
        clawX += clawSpeed;
        // Move carried prize with claw
        if (prizeBeingLifted) {
          prizeBeingLifted.x = clawX - prizeBeingLifted.width / 2;
        }
      }

      // Handle claw dropping
      if (clawDropping) {
        clawY += clawDropSpeed;

        // When claw reaches near bottom, close it and grab
        if (clawY > 380 && clawOpen) {
          clawOpen = false;
          clawGrabbing = true;
          attemptGrabPrize();
        }

        // If claw reaches bottom, start raising
        if (clawY >= 400) {
          clawDropping = false;
          clawRaising = true;
        }
      }

      // Handle claw raising with prize
      if (clawRaising) {
        clawY -= clawRiseSpeed;

        // If carrying a prize, lift it up
        if (prizeBeingLifted) {
          prizeLiftedY += 3;
          prizeBeingLifted.y = clawY + 30 - prizeLiftedY;

          // Check if prize slips (based on weight and grab strength)
          if (prizeBeingLifted) {
            const slipChance = (prizeBeingLifted.weight / clawGrabStrength) * 0.01;
            if (Math.random() < slipChance && prizeLiftedY > 50) {
              // Prize slips!
              prizeBeingLifted.beingCarried = false;
              prizeBeingLifted.y = 400 - prizeBeingLifted.height;
              prizeBeingLifted = null;
              clawHasPrize = false;
            }
          }
        }

        // When claw reaches top with prize
        if (clawY <= 60) {
          clawRaising = false;
          clawOpen = true;

          if (clawHasPrize && currentPrize) {
            // Successfully brought prize to top
            setTimeout(() => {
              winGame(currentPrize);
            }, 500);
          } else {
            // Failed to bring prize up
            loseGame();
          }
        }
      }

      drawGame();
      requestAnimationFrame(gameLoop);
    }

    // Attempt to grab a prize
    function attemptGrabPrize() {
      let bestPrize = null;
      let bestDistance = Infinity;

      for (const prize of prizes) {
        if (!prize.collected && !prize.beingCarried) {
          const prizeCenterX = prize.x + prize.width / 2;
          const prizeCenterY = prize.y + prize.height / 2;
          const distanceX = Math.abs(clawX - prizeCenterX);
          const distanceY = Math.abs(clawY - prizeCenterY);

          // Check if claw is positioned over prize
          if (distanceX < 40 && distanceY < 50) {
            const totalDistance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);

            if (totalDistance < bestDistance) {
              bestDistance = totalDistance;
              bestPrize = prize;
            }
          }
        }
      }

      if (bestPrize) {
        // Calculate grab success based on alignment and prize weight
        let successChance = 0.7; // Base chance
        const alignmentFactor = 1 - (bestDistance / 50);
        const weightFactor = 1 / bestPrize.weight;

        successChance *= alignmentFactor * weightFactor;
        successChance = Math.max(0.3, Math.min(0.9, successChance));

        if (Math.random() < successChance) {
          // Successful grab!
          clawHasPrize = true;
          currentPrize = bestPrize;
          prizeBeingLifted = bestPrize;
          bestPrize.beingCarried = true;
          prizeLiftedY = 0;
          clawGrabStrength = 1.2 - (bestPrize.weight * 0.2);

          // Adjust drop speed based on prize weight
          clawDropSpeed = 6 + (bestPrize.weight * 2);
          clawRiseSpeed = 4 + (1 / bestPrize.weight);

          createHeartParticles(canvas.offsetLeft + clawX, canvas.offsetTop + clawY, 5);
          return true;
        }
      }

      clawHasPrize = false;
      currentPrize = null;
      prizeBeingLifted = null;
      return false;
    }

    // Win game
    function winGame(prize) {
      gameActive = false;

      if (prize && !prize.collected) {
        prize.collected = true;
        prize.beingCarried = false;
        score += prize.points;
        wins++;
        collectedPrizes++;
        tokens -= 1;

        createHeartParticles(canvas.offsetLeft + canvas.width / 2, canvas.offsetTop + canvas.height / 2, 20);

        updateUI();

        prizeNameEl.textContent = prize.name;
        prizePointsEl.textContent = prize.points;
        wonPrizeImageEl.src = prize.image;
        wonPrizeImageEl.alt = prize.name;
        
        showModal(winMessageEl);
      }
    }

    // Lose game
    function loseGame() {
      gameActive = false;
      tokens -= 1;

      // Reset any prize being carried
      if (prizeBeingLifted) {
        prizeBeingLifted.beingCarried = false;
        prizeBeingLifted.y = 400 - prizeBeingLifted.height;
        prizeBeingLifted = null;
      }

      updateUI();

      if (tokens <= 0) {
        showModal(noTokensMessageEl);
      } else {
        showModal(loseMessageEl);
      }
    }

    // Reset the entire game
    function resetGame() {
      // Reset game variables
      tokens = 200;
      score = 0;
      wins = 0;
      collectedPrizes = 0;
      gameActive = true;
      clawX = 350;
      clawY = 50;
      clawDropping = false;
      clawRaising = false;
      clawHasPrize = false;
      clawOpen = true;
      clawGrabbing = false;
      currentPrize = null;
      prizeBeingLifted = null;
      prizeLiftedY = 0;
      
      // Reset prizes to original positions
      prizes = JSON.parse(JSON.stringify(originalPrizes));
      
      // Hide all messages
      hideModal(winMessageEl);
      hideModal(loseMessageEl);
      hideModal(noTokensMessageEl);
      
      // Update UI
      updateUI();
      
      // Create celebration particles
      createHeartParticles(window.innerWidth / 2, window.innerHeight / 2, 10);
      
      // Redraw immediately
      drawGame();
    }

    // Setup event listeners - FIXED FOR MOBILE
    function setupEventListeners() {
      // Arrow buttons - Mobile touch support (continuous movement)
      const arrowButtons = [leftBtn, rightBtn];
      arrowButtons.forEach(btn => {
        // Mouse events
        btn.addEventListener('mousedown', (event) => {
          btn.classList.add('active');
          event.preventDefault();
        });
        btn.addEventListener('mouseup', (event) => {
          btn.classList.remove('active');
          event.preventDefault();
        });
        btn.addEventListener('mouseleave', () => {
          btn.classList.remove('active');
        });
        
        // Touch events for mobile
        btn.addEventListener('touchstart', (event) => {
          btn.classList.add('active');
          event.preventDefault();
        }, { passive: false });
        
        btn.addEventListener('touchend', (event) => {
          btn.classList.remove('active');
          event.preventDefault();
        }, { passive: false });
        
        btn.addEventListener('touchcancel', () => {
          btn.classList.remove('active');
        });
      });

      // Drop button - SIMPLE CLICK/TAP (not hold)
      dropBtn.addEventListener('click', handleDrop);
      
      // Mobile touch for drop button
      dropBtn.addEventListener('touchstart', (event) => {
        // Just trigger the drop, don't hold
        handleDrop();
        event.preventDefault();
      }, { passive: false });

      // Reset button
      resetBtn.addEventListener('click', resetGame);

      // Continue and try again buttons
      continueBtn.addEventListener('click', () => {
        hideModal(winMessageEl);
        resetClaw();
        gameActive = true;
        gameLoop();
      });

      tryAgainBtn.addEventListener('click', () => {
        hideModal(loseMessageEl);
        resetClaw();
        gameActive = true;
        gameLoop();
      });

      // Add tokens buttons
      const addTokensFunc = () => {
        tokens += 20;
        updateUI();
        hideModal(noTokensMessageEl);
        createHeartParticles(window.innerWidth / 2, window.innerHeight / 2, 5);
      };
      addTokensBtn.addEventListener('click', addTokensFunc);
      if (getMoreTokensBtn) {
        getMoreTokensBtn.addEventListener('click', addTokensFunc);
      }

      // Keyboard controls
      document.addEventListener('keydown', (e) => {
        if (!gameActive) return;

        switch (e.key) {
          case 'ArrowLeft':
            leftBtn.classList.add('active');
            e.preventDefault();
            break;
          case 'ArrowRight':
            rightBtn.classList.add('active');
            e.preventDefault();
            break;
          case ' ':
          case 'Spacebar':
            handleDrop();
            e.preventDefault();
            break;
        }
      });

      document.addEventListener('keyup', (e) => {
        switch (e.key) {
          case 'ArrowLeft':
            leftBtn.classList.remove('active');
            break;
          case 'ArrowRight':
            rightBtn.classList.remove('active');
            break;
        }
      });
      
      // Prevent context menu on buttons
      arrowButtons.forEach(btn => {
        btn.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          return false;
        });
      });
    }

    // Handle drop button click
    function handleDrop() {
      if (tokens <= 0) {
        showModal(noTokensMessageEl);
        return;
      }
      if (!clawDropping && !clawRaising && gameActive) {
        dropClaw();
      }
    }

    // Drop the claw
    function dropClaw() {
      if (!gameActive || clawDropping || clawRaising || tokens <= 0) return;

      clawDropping = true;
      clawOpen = true;
      clawGrabbing = false;
      clawHasPrize = false;
      currentPrize = null;
      prizeBeingLifted = null;
    }

    // Reset claw position
    function resetClaw() {
      clawX = 350;
      clawY = 50;
      clawDropping = false;
      clawRaising = false;
      clawHasPrize = false;
      clawOpen = true;
      clawGrabbing = false;
      currentPrize = null;
      prizeBeingLifted = null;
      prizeLiftedY = 0;
      clawDropSpeed = 8;
      clawRiseSpeed = 6;

      // Reset any prize being carried state
      prizes.forEach(prize => {
        prize.beingCarried = false;
      });
    }

    // Initialize game
    document.addEventListener('DOMContentLoaded', initGame);
  </script>
